<svg xmlns="http://www.w3.org/2000/svg" width="510" height="88" viewBox="0 0 510 88" role="img" aria-labelledby="title">
  <title id="title">ORBIS supports Sustainable Development Goals 9, 11, and 12</title>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(0 4)">
      <rect width="160" height="80" rx="12" fill="#FD6925"/>
      <circle cx="34" cy="40" r="22" fill="#fff" fill-opacity=".16"/>
      <text x="34" y="47" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">9</text>
      <text x="67" y="34" fill="#fff" font-size="11" font-weight="700">INDUSTRY,</text>
      <text x="67" y="49" fill="#fff" font-size="11" font-weight="700">INNOVATION &amp;</text>
      <text x="67" y="64" fill="#fff" font-size="11" font-weight="700">INFRASTRUCTURE</text>
    </g>
    <g transform="translate(175 4)">
      <rect width="160" height="80" rx="12" fill="#FD9D24"/>
      <circle cx="34" cy="40" r="22" fill="#fff" fill-opacity=".18"/>
      <text x="34" y="47" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">11</text>
      <text x="67" y="34" fill="#fff" font-size="11" font-weight="700">SUSTAINABLE</text>
      <text x="67" y="49" fill="#fff" font-size="11" font-weight="700">CITIES &amp;</text>
      <text x="67" y="64" fill="#fff" font-size="11" font-weight="700">COMMUNITIES</text>
    </g>
    <g transform="translate(350 4)">
      <rect width="160" height="80" rx="12" fill="#BF8B2E"/>
      <circle cx="34" cy="40" r="22" fill="#fff" fill-opacity=".18"/>
      <text x="34" y="47" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">12</text>
      <text x="67" y="34" fill="#fff" font-size="11" font-weight="700">RESPONSIBLE</text>
      <text x="67" y="49" fill="#fff" font-size="11" font-weight="700">CONSUMPTION</text>
      <text x="67" y="64" fill="#fff" font-size="11" font-weight="700">&amp; PRODUCTION</text>
    </g>
  </g>
</svg>
